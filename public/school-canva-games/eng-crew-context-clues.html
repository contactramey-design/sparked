<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prove It with the Text</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      padding: 0;
      font-family: 'Fredoka', Arial, sans-serif;
    }
    
    * { box-sizing: border-box; }


    .wrapper {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    }


    header {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      color: white;
      padding: 24px 16px;
      box-shadow: 0 4px 20px rgba(217, 119, 6, 0.25);
    }


    header h1 { 
      margin: 0; 
      font-size: 2rem;
      font-weight: 700;
    }


    header p { 
      margin: 8px 0 0 0; 
      font-size: 0.95rem; 
      opacity: 0.95;
    }


    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }


    .game-box {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.1);
      margin-bottom: 20px;
    }


    .challenge-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #d97706;
      margin-bottom: 12px;
    }


    .progress {
      width: 100%;
      height: 8px;
      background: #fed7aa;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }


    .progress-bar {
      height: 100%;
      background: #d97706;
      transition: width 0.5s ease;
    }


    .passage-box {
      background: #fffbeb;
      border-left: 4px solid #d97706;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
      line-height: 1.6;
      color: #333;
    }


    .passage-box p {
      margin: 12px 0;
      font-size: 0.95rem;
    }


    .passage-box p span.highlight {
      background: #fbbf24;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }


    .passage-box p span.highlight:hover {
      background: #f59e0b;
    }


    .passage-box p span.highlight.selected {
      background: #d97706;
      color: white;
      font-weight: 600;
    }


    .claim-box {
      background: #dbeafe;
      border-left: 4px solid #0369a1;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }


    .claim-box label {
      display: block;
      font-weight: 600;
      color: #0369a1;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }


    .claim-text {
      font-size: 1.1rem;
      color: #333;
      font-weight: 600;
    }


    .evidence-section {
      background: #ecfdf5;
      border-left: 4px solid #059669;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }


    .evidence-section label {
      display: block;
      font-weight: 600;
      color: #059669;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }


    .evidence-options {
      display: grid;
      gap: 10px;
    }


    .evidence-option {
      background: white;
      border: 2px solid #d1fae5;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }


    .evidence-option:hover {
      border-color: #059669;
      background: #f0fdf4;
    }


    .evidence-option input[type="radio"] {
      margin-right: 8px;
    }


    .evidence-option label {
      margin: 0;
      cursor: pointer;
      font-weight: 500;
      color: #333;
      display: flex;
      align-items: flex-start;
    }


    .evidence-option.selected {
      background: #d1fae5;
      border-color: #059669;
    }


    .explanation-box {
      background: #fef3c7;
      border-left: 4px solid #b45309;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }


    .explanation-box label {
      display: block;
      font-weight: 600;
      color: #b45309;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }


    .explanation-box textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #fcd34d;
      border-radius: 6px;
      font-family: 'Fredoka', Arial, sans-serif;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 80px;
    }


    .explanation-box textarea:focus {
      outline: none;
      border-color: #b45309;
      background: white;
    }


    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }


    button {
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Fredoka', Arial, sans-serif;
    }


    .btn-submit {
      background: #d97706;
      color: white;
      flex: 1;
      min-width: 150px;
    }


    .btn-submit:hover {
      background: #b45309;
      transform: translateY(-2px);
    }


    .btn-reset {
      background: #9ca3af;
      color: white;
    }


    .btn-reset:hover {
      background: #6b7280;
    }


    .message {
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
      text-align: center;
      font-weight: 600;
    }


    .message.success {
      background: #d1fae5;
      color: #065f46;
      border-left: 4px solid #059669;
    }


    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border-left: 4px solid #dc2626;
    }


    .message.info {
      background: #dbeafe;
      color: #082f49;
      border-left: 4px solid #0369a1;
    }


    .finish-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }


    .finish-screen.active {
      display: block;
    }


    .finish-emoji {
      font-size: 3rem;
      margin-bottom: 16px;
    }


    .finish-screen h2 {
      font-size: 1.8rem;
      color: #d97706;
      margin: 12px 0;
    }


    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }


    .stat-box {
      background: #fed7aa;
      border: 2px solid #d97706;
      border-radius: 8px;
      padding: 16px;
    }


    .stat-num {
      font-size: 2rem;
      font-weight: 700;
      color: #d97706;
    }


    .stat-label {
      font-size: 0.8rem;
      color: #b45309;
      margin-top: 4px;
    }


    .btn-play-again {
      background: #d97706;
      color: white;
      margin-top: 16px;
    }


    .btn-play-again:hover {
      background: #b45309;
    }


    .hint-box {
      background: #e0e7ff;
      border-left: 4px solid #6366f1;
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 0.9rem;
      color: #4f46e5;
      font-style: italic;
    }


    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .passage-box { font-size: 0.9rem; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div class="wrapper">
   <header>
    <h1 id="lessonTitle">Context Clues Detective</h1>
    <p id="instructionText">Read the sentence and use context clues to figure out what the bold word means</p>
   </header>
   <main>
    <div id="gameScreen" class="game-box">
     <div class="progress">
      <div class="progress-bar" id="progressBar" style="width: 0%"></div>
     </div>
     <div class="challenge-title" id="challengeTitle">
      Question 1 of 5
     </div><!-- Hint -->
     <div class="hint-box" id="hintBox"></div><!-- Sentence -->
     <div class="passage-box" id="sentenceBox"></div><!-- Word Meaning Question -->
     <div class="claim-box">
      <label>What does the bold word mean?</label>
      <div class="claim-text" id="wordDisplay"></div>
     </div><!-- Definition Options -->
     <div class="evidence-section">
      <label>Pick the best definition:</label>
      <div class="evidence-options" id="definitionOptions"></div>
     </div><!-- Explanation -->
     <div class="explanation-box">
      <label>How did you know? What clue words helped you? Explain:</label> <textarea id="explanationInput" placeholder="Example: I knew because the sentence said... which shows..."></textarea>
     </div><!-- Buttons -->
     <div class="buttons">
      <button class="btn-reset" onclick="resetQuestion()">Start Over</button> <button class="btn-submit" onclick="submitAnswer()">Check My Work</button>
     </div>
     <div id="messageBox"></div>
    </div><!-- Finish Screen -->
    <div id="finishScreen" class="game-box finish-screen">
     <div class="finish-emoji">
      🔍✅📚
     </div>
     <h2 id="finishTitle">Evidence Detective!</h2>
     <p id="finishMessage">You found textual evidence like a pro!</p>
     <div class="stats-grid">
      <div class="stat-box">
       <div class="stat-num" id="statCorrect">
        0
       </div>
       <div class="stat-label">
        Correct Evidence
       </div>
      </div>
      <div class="stat-box">
       <div class="stat-num" id="statExplained">
        0
       </div>
       <div class="stat-label">
        Strong Explanations
       </div>
      </div>
     </div><button class="btn-play-again" onclick="location.reload()">Try Again</button>
    </div>
   </main>
  </div>
  <script>
    const lessons = [
      {
        sentence: "The nocturnal animal, meaning active at night, hunted when the sun went down.",
        boldWord: "nocturnal",
        correctDefinition: "active at night",
        options: [
          { text: "active at night", correct: true, clueType: "definition" },
          { text: "sleeping during the day", correct: false, clueType: "none" },
          { text: "hungry and dangerous", correct: false, clueType: "none" },
          { text: "moving very fast", correct: false, clueType: "none" }
        ],
        clueHint: "The author gives a DEFINITION clue right after the word!"
      },
      {
        sentence: "The children were jubilant, just like their friend who was jumping and laughing with joy.",
        boldWord: "jubilant",
        correctDefinition: "very happy and joyful",
        options: [
          { text: "very tired", correct: false, clueType: "none" },
          { text: "very happy and joyful", correct: true, clueType: "example" },
          { text: "a little sad", correct: false, clueType: "none" },
          { text: "scared and worried", correct: false, clueType: "none" }
        ],
        clueHint: "Look for EXAMPLE clues that show what the word means!"
      },
      {
        sentence: "Unlike the obedient dog that sat when told, the stubborn cat refused to listen.",
        boldWord: "obedient",
        correctDefinition: "willing to follow orders or commands",
        options: [
          { text: "willing to follow orders", correct: true, clueType: "contrast" },
          { text: "likes to eat treats", correct: false, clueType: "none" },
          { text: "is very old and slow", correct: false, clueType: "none" },
          { text: "sleeps all day long", correct: false, clueType: "none" }
        ],
        clueHint: "The word 'unlike' signals a CONTRAST clue!"
      },
      {
        sentence: "The arid desert, where it hardly ever rains, was too dry for most plants to grow.",
        boldWord: "arid",
        correctDefinition: "very dry with little water",
        options: [
          { text: "very hot and sunny", correct: false, clueType: "none" },
          { text: "very dry with little water", correct: true, clueType: "definition" },
          { text: "flat and sandy", correct: false, clueType: "none" },
          { text: "far from cities", correct: false, clueType: "none" }
        ],
        clueHint: "The author explains what the word means nearby!"
      },
      {
        sentence: "The frugal shopper, unlike her friend who spent money on everything, carefully saved her coins and bought only what she needed.",
        boldWord: "frugal",
        correctDefinition: "careful about spending money; not wasteful",
        options: [
          { text: "very poor and sad", correct: false, clueType: "none" },
          { text: "careful about spending money", correct: true, clueType: "contrast" },
          { text: "enjoys going to stores", correct: false, clueType: "none" },
          { text: "loves buying expensive things", correct: false, clueType: "none" }
        ],
        clueHint: "Compare what the word is NOT to figure out what it IS!"
      }
    ];


    let currentLesson = 0;
    let correctCount = 0;
    let explainedCount = 0;
    let selectedDefinition = null;


    const defaultConfig = {
      lesson_title: 'Context Clues Detective',
      instruction_text: 'Read the sentence and use context clues to figure out what the bold word means',
      completion_message: 'Context Clues Master!'
    };


    function initGame() {
      loadLesson();
      lucide.createIcons();
    }


    function loadLesson() {
      const lesson = lessons[currentLesson];
      
      // Display hint
      document.getElementById('hintBox').textContent = lesson.clueHint;
      
      // Render sentence with bold word
      const sentenceBox = document.getElementById('sentenceBox');
      const parts = lesson.sentence.split(lesson.boldWord);
      sentenceBox.innerHTML = `<p>${parts[0]}<strong style="background: #fcd34d; padding: 2px 4px; border-radius: 3px;">${lesson.boldWord}</strong>${parts[1]}</p>`;


      // Display word
      document.getElementById('wordDisplay').textContent = `"${lesson.boldWord}"`;


      // Render definition options
      const optionsBox = document.getElementById('definitionOptions');
      optionsBox.innerHTML = lesson.options.map((option, idx) => `
        <div class="evidence-option" onclick="selectDefinition(${idx})">
          <label>
            <input type="radio" name="definition" value="${idx}">
            <span>${option.text}</span>
          </label>
        </div>
      `).join('');


      // Clear explanation
      document.getElementById('explanationInput').value = '';
      document.getElementById('messageBox').innerHTML = '';
      
      // Reset selection
      selectedDefinition = null;


      // Update title
      document.getElementById('challengeTitle').textContent = `Question ${currentLesson + 1} of ${lessons.length}`;
      
      updateProgress();
    }


    function selectDefinition(idx) {
      selectedDefinition = idx;
      const options = document.querySelectorAll('.evidence-option');
      options.forEach((opt, i) => {
        opt.classList.toggle('selected', i === idx);
        opt.querySelector('input[type="radio"]').checked = (i === idx);
      });
    }


    function resetQuestion() {
      selectedDefinition = null;
      document.querySelectorAll('.evidence-option').forEach(opt => opt.classList.remove('selected'));
      document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
      document.getElementById('explanationInput').value = '';
      document.getElementById('messageBox').innerHTML = '';
    }


    function isValidExplanation(explanation) {
      const weakPhrases = ['i don\'t know', 'idk', 'i guess', 'um', 'just because', 'i think so', 'no reason', 'random', 'not sure', 'dunno', 'whatever', 'lucky'];
      const lowerExpl = explanation.toLowerCase().trim();
      
      // Reject empty or whitespace-only
      if (lowerExpl.length === 0) {
        return false;
      }
      
      // Check for weak phrases
      if (weakPhrases.some(phrase => lowerExpl.includes(phrase))) {
        return false;
      }
      
      // Minimum 20 characters (must be a real sentence)
      if (explanation.length < 20) {
        return false;
      }
      
      // MUST have at least one connection/reasoning word
      const reasoningWords = ['because', 'shows', 'means', 'tells', 'clue', 'hint', 'sentence', 'said', 'word', 'example', 'unlike', 'opposite', 'same', 'similar'];
      const hasReasoning = reasoningWords.some(word => lowerExpl.includes(word));
      if (!hasReasoning) {
        return false;
      }
      
      // Must reference the actual clue from the sentence
      const lesson = lessons[currentLesson];
      const selectedOption = lesson.options[selectedDefinition];
      
      // At least 2 distinct words from explanation should NOT be in the definition choice
      const definitionWords = selectedOption.text.toLowerCase().split(' ');
      const explanationWords = lowerExpl.split(' ');
      const uniqueWords = explanationWords.filter(word => 
        word.length > 3 && !definitionWords.includes(word) && word !== 'the' && word !== 'and' && word !== 'that' && word !== 'this'
      );
      
      if (uniqueWords.length < 2) {
        return false;
      }
      
      return true;
    }


    function submitAnswer() {
      if (selectedDefinition === null) {
        document.getElementById('messageBox').innerHTML = '<div class="message error">Please pick a definition first!</div>';
        return;
      }


      const explanation = document.getElementById('explanationInput').value.trim();
      
      const lesson = lessons[currentLesson];
      const chosenOption = lesson.options[selectedDefinition];
      const isCorrect = chosenOption.correct;
      const hasStrongExplanation = isValidExplanation(explanation);


      if (!isCorrect) {
        document.getElementById('messageBox').innerHTML = '<div class="message error">That\'s not quite right. Look back at the context clues in the sentence. What words nearby help you understand the bold word?</div>';
        return;
      }


      if (!hasStrongExplanation) {
        document.getElementById('messageBox').innerHTML = '<div class="message error">Good choice! But explain HOW you knew. What clue words or phrases helped you? Use words like "because," "the sentence said," or "this shows."</div>';
        return;
      }


      // Both correct definition AND strong explanation
      correctCount++;
      explainedCount++;
      document.getElementById('messageBox').innerHTML = '<div class="message success">✅ Perfect! You picked the right definition AND explained your thinking with the clues!</div>';


      setTimeout(() => {
        if (currentLesson < lessons.length - 1) {
          currentLesson++;
          loadLesson();
        } else {
          finishGame();
        }
      }, 2000);
    }


    function updateProgress() {
      const pct = (correctCount / lessons.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
    }


    function finishGame() {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('finishScreen').classList.add('active');
      document.getElementById('finishMessage').textContent = defaultConfig.completion_message;
      document.getElementById('finishTitle').textContent = defaultConfig.completion_message;
      document.getElementById('statCorrect').textContent = correctCount;
      document.getElementById('statExplained').textContent = explainedCount;
    }


    function applyConfig(config) {
      if (config.lesson_title) {
        document.getElementById('lessonTitle').textContent = config.lesson_title;
      }
      if (config.instruction_text) {
        document.getElementById('instructionText').textContent = config.instruction_text;
      }
      if (config.completion_message) {
        defaultConfig.completion_message = config.completion_message;
      }
    }


    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        applyConfig(config);
      },
      mapToCapabilities: () => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['lesson_title', config.lesson_title || defaultConfig.lesson_title],
        ['instruction_text', config.instruction_text || defaultConfig.instruction_text],
        ['completion_message', config.completion_message || defaultConfig.completion_message]
      ])
    });


    applyConfig(defaultConfig);
    initGame();
  </script>
 </body>
</html>
